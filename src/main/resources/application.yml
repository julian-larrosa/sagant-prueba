server:
  port: 8080

spring:
  application:
    name: notification-service
  config:
    import: "optional:file:.env[.properties]"


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:HOLA123}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false


app:
  security:
    api-key: "key"
  dispatch:
    max-retries: 2
    retry-delay-ms: 1000