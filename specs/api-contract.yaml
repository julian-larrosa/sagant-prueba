openapi: 3.0.3
info:
  title: Notification Service API
  description: API REST para recepción y despacho asíncrono de notificaciones.
  version: 1.0.0
paths:
  /api/notifications:
    post:
      summary: Enviar una nueva notificación
      description: Valida, persiste con estado PENDING y encola el despacho asíncrono.
      parameters:
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
          example: "key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '202':
          description: Notificación aceptada para procesamiento asíncrono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          description: Error de validación en los datos de entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API Key faltante o inválida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    NotificationRequest:
      type: object
      required:
        - recipient
        - channel
        - subject
        - body
      properties:
        recipient:
          type: string
          description: Destinatario (ej. email o identificador).
          example: "cliente@empresa.com"
        channel:
          type: string
          enum: [LOG, EMAIL]
          description: Canal de despacho seleccionado.
          example: "EMAIL"
        subject:
          type: string
          description: Asunto o título de la notificación.
          example: "Bienvenido a nuestro servicio"
        body:
          type: string
          description: Contenido del mensaje.
          example: "Hola, tu cuenta ha sido creada exitosamente."

    NotificationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        status:
          type: string
          example: "PENDING"
        message:
          type: string
          example: "Notification accepted for asynchronous dispatch"

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Validation failed"
        details:
          type: array
          items:
            type: string
          example: ["recipient: no debe estar vacío", "subject: no debe estar vacío"]